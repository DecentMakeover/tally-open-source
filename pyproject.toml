[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "bahi"
dynamic = ["version"]
description = "Open-source, keyboard-first double-entry accounting with Indian GST"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["accounting", "bookkeeping", "gst", "india", "double-entry", "invoicing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = ["fastapi>=0.110", "uvicorn>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.urls]
Repository = "https://github.com/ryanatgalen/tally-open-source"
Issues = "https://github.com/ryanatgalen/tally-open-source/issues"

[project.scripts]
bahi = "bahi.cli:main"

[tool.hatch.version]
path = "src/bahi/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bahi"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
