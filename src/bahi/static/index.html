<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bahi</title>
  <meta name="description" content="Open-source double-entry accounting with GST">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f5f4a'/%3E%3Cpath d='M9 8h9a5 5 0 0 1 0 10H9zM9 18h10a5 5 0 0 1 0 10H9z' fill='none' stroke='%23f6f3ec' stroke-width='2.6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="no-company">
  <header class="top">
    <a class="brand" href="#/" title="Switch company">
      <span class="mark" aria-hidden="true">B</span>Bahi
    </a>
    <div class="co" id="co-name"></div>
    <div class="period" id="period">
      <label>From <input type="date" id="p-from"></label>
      <label>To <input type="date" id="p-to"></label>
    </div>
    <button class="ghost icon" id="help-btn" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">?</button>
  </header>
  <nav id="nav" aria-label="Main"></nav>
  <main id="main"><p class="muted pad">Loading...</p></main>
  <div id="toasts" aria-live="polite"></div>
  <div id="help" class="overlay" hidden>
    <div class="card help">
      <h2>Keyboard</h2>
      <div id="help-body"></div>
      <p class="muted">Press <kbd>Esc</kbd> to close.</p>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
